name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  app:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check app.js syntax
        run: node --check ../app.js

      - name: Install test tools
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run tests
        run: |
          mkdir -p output
          npm test 2>&1 | tee output/test-log.txt

      - name: Show failed checks
        if: failure()
        run: grep -E '✗|FAIL' output/test-log.txt | sed 's/^/::error::/' || true

      - name: Keep screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/output/

  database:
    name: Database rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply Servers SQL and check security rules
        run: bash tests/sql/run.sh
